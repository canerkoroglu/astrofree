appId: app.astrofree.desktop
productName: AstroFree
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/cities.json.gz
    to: cities.json.gz
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: NOTICE.md
    to: NOTICE.md
  - from: build/icon.png
    to: icon.png
asarUnpack:
  - node_modules/swisseph-wasm/wasm/**
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.lifestyle
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
portable:
  artifactName: ${productName}-${version}-win-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: [AppImage, deb]
  category: Science
  maintainer: Caner Köroğlu <ckoroglu@ymail.com>
publish:
  provider: github
  owner: canerkoroglu
  repo: astrofree
  releaseType: draft
